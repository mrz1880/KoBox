# CI for the kobox/ rewrite only — legacy MySB workflows are untouched.
name: kobox-ci

on:
  # main only: on a feature branch the pull_request run below already covers
  # every job a push would run, plus the E2E. The run on main tests what the
  # rebase merge actually produced, and the pre-push hook needs it to tag.
  push:
    branches: [main]
    paths: ['kobox/**', '.github/workflows/kobox-ci.yml']
  # every pull request, without a paths filter: both test jobs are required
  # checks on main, and a filtered-out workflow never reports, which would
  # block a docs-only PR forever. The changes job decides instead.
  pull_request:

defaults:
  run:
    working-directory: kobox

jobs:
  changes:
    name: does this touch kobox?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # push to main is already filtered by paths; a pull request is compared
      # with its base. A job skipped by its condition counts as passed.
      - id: diff
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(kobox/|\.github/workflows/kobox-ci\.yml$)'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  fast:
    name: lint + typecheck + unit + component + contract
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: kobox/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: kobox/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm build

  debian13:
    name: integration + e2e (Debian 13 privileged)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      # The steps go through the Makefile, as in local runs: one definition of
      # each command, and the compose project name the Makefile derives.
      - name: Build and boot the Debian 13 systemd container
        run: make up
      - name: Integration tests (real system adapters)
        run: make test-int
      - name: E2E (create -> suspend -> resume -> delete)
        run: make e2e
      - name: Teardown
        if: always()
        run: make down
