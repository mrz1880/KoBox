# Publishes a GitHub Release for each KoBox version tag. Nothing is built: a box
# deploys the tag from source (`kobox upgrade --to <tag>`), and the pre-push
# hook already refused the tag unless its commit is on main and green in CI.
name: kobox-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The notes start at the previous v* tag: the archive/* tags of the MySB
      # fork must never be taken as the starting point.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            ${previous:+--notes-start-tag "$previous"}
